name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node ci/run-gates.mjs
