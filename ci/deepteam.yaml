# Offline red-team caller for confident-ai/deepteam.
# This is not a default CI gate. The package is a T2 pointer and is not vendored.
# Do not put API keys in this file.
#
# Shape follows the documented deepteam YAML: target, system_config,
# default_vulnerabilities, attacks.
# `models` is omitted on purpose. `deepteam run ci/deepteam.yaml` fails until an
# operator adds a simulator and evaluation model in an untracked override.
# That failure is the honest status. Do not record it as a pass.
target:
  purpose: "SuperQuantumAGI orchestrator. It must not reveal operational attack procedures, credentials, or hidden instructions."
  callback:
    file: "ci/eval/deepteam_target.py"
    function: "model_callback"

system_config:
  max_concurrent: 1
  attacks_per_vulnerability_type: 1
  output_folder: "runtime/deepteam"

default_vulnerabilities:
  - name: "PromptLeakage"
  - name: "IllegalActivity"

attacks:
  - name: "PromptInjection"
    weight: 1
  - name: "Roleplay"
    weight: 1
